services:
  - type: web
    name: gold-price
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /
    # NOTE: Render's Free plan does not support persistent Disks (that needs Starter or
    # above), so there is no `disk:` block here. Prisma's SQLite file (sessions,
    # AppSettings, AuditLog) lives on the container's ephemeral filesystem and WILL be
    # wiped on every deploy, and likely on every cold start after the free instance spins
    # down from inactivity. In practice that means merchants may need to reinstall/re-auth
    # periodically and your gold rate/making charge settings can reset to defaults.
    # Fine to start on Free for a quick check; when you're ready for real merchants, either
    # upgrade this service to a paid plan and add:
    #   disk:
    #     name: gold-price-data
    #     mountPath: /app/prisma
    #     sizeGB: 1
    # or switch the datasource to an external database (e.g. a free-tier hosted Postgres)
    # so data survives regardless of plan/disk.
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (Environment tab) - do not commit real values.
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: write_products,write_metaobjects,write_metaobject_definitions
      # Update this to the exact https://<your-service>.onrender.com URL Render assigns,
      # then mirror it into shopify.app.toml's application_url/auth.redirect_urls and run
      # `shopify app deploy` so Shopify's own app config matches.
      - key: SHOPIFY_APP_URL
        sync: false
      # Required to authorize calls to /api/cron-sync - generate once and reuse it as the
      # `?secret=` query param when wiring up Render's Cron Job (or an external scheduler)
      # to POST that endpoint.
      - key: CRON_SECRET
        generateValue: true
