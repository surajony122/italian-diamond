services:
  - type: web
    name: gold-price
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /
    # No `disk:` block needed (and Render's Free plan doesn't support one anyway) -
    # data now lives in an external Postgres via DATABASE_URL, not on this container's
    # ephemeral filesystem, so it survives redeploys and cold-start-from-sleep on any plan.
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (Environment tab) - do not commit real values.
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: write_products,write_metaobjects,write_metaobject_definitions
      # Update this to the exact https://<your-service>.onrender.com URL Render assigns,
      # then mirror it into shopify.app.toml's application_url/auth.redirect_urls and run
      # `shopify app deploy` so Shopify's own app config matches.
      - key: SHOPIFY_APP_URL
        sync: false
      # Connection string for an external Postgres (e.g. Neon, Supabase free tier).
      # Prisma's schema.prisma reads this via env("DATABASE_URL").
      - key: DATABASE_URL
        sync: false
      # Required to authorize calls to /api/cron-sync - generate once and reuse it as the
      # `?secret=` query param when wiring up an external scheduler (e.g. cron-job.org)
      # to POST that endpoint.
      - key: CRON_SECRET
        generateValue: true
